name: CI

# Fast, deterministic gate: lint + typecheck + unit tests (incl. the core
# contract test, which starts a real rpc-server but touches no relay).  No
# network to third-party relays -- live probes run in live.yml on a schedule.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check chatmail_prober tests scripts grafana

      - name: Typecheck
        run: uv run mypy chatmail_prober

      - name: Unit tests (excludes live relay probes)
        run: uv run pytest tests/ --ignore=tests/test_live.py
